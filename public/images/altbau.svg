<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Stilisierte Altbaufassade mit modernisierter Elektrik">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102A4E"/>
      <stop offset="1" stop-color="#0A1B33"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <!-- Fassade -->
  <rect x="200" y="90" width="400" height="510" fill="#0A1B33" stroke="rgba(255,255,255,0.35)" stroke-width="2.5"/>
  <path d="M180 90 H620" stroke="rgba(255,255,255,0.4)" stroke-width="4"/>
  <path d="M190 118 H610" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <!-- Fensterreihen mit Stuckbögen -->
  <g fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2">
    <path d="M250 200 v-40 a25 25 0 0 1 50 0 v40 z"/>
    <path d="M375 200 v-40 a25 25 0 0 1 50 0 v40 z"/>
    <path d="M500 200 v-40 a25 25 0 0 1 50 0 v40 z"/>
    <rect x="250" y="260" width="50" height="70"/>
    <rect x="375" y="260" width="50" height="70"/>
    <rect x="500" y="260" width="50" height="70"/>
    <rect x="250" y="380" width="50" height="70"/>
    <rect x="500" y="380" width="50" height="70"/>
  </g>
  <!-- beleuchtetes Fenster -->
  <rect x="375" y="380" width="50" height="70" fill="#FFD60A" opacity="0.9"/>
  <!-- Tür -->
  <path d="M370 600 v-80 a30 30 0 0 1 60 0 v80" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2.5"/>
  <!-- neue Leitung an der Fassade -->
  <path d="M620 600 V330 H680 V150" stroke="#FFD60A" stroke-width="2.5" fill="none"/>
  <circle cx="680" cy="150" r="5" fill="#0A1B33" stroke="#FFD60A" stroke-width="2"/>
  <circle cx="620" cy="330" r="5" fill="#0A1B33" stroke="#FFD60A" stroke-width="2"/>
  <text x="640" y="580" font-family="monospace" font-size="16" fill="rgba(255,255,255,0.45)" letter-spacing="3">EST. 1908</text>
</svg>
