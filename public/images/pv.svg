<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Stilisierte Photovoltaikanlage mit Speicher">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102A4E"/>
      <stop offset="1" stop-color="#0A1B33"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <!-- Sonne -->
  <circle cx="620" cy="130" r="46" fill="none" stroke="#FFD60A" stroke-width="3"/>
  <g stroke="#FFD60A" stroke-width="3" stroke-linecap="round">
    <path d="M620 56 v-20"/><path d="M620 224 v-20"/>
    <path d="M546 130 h-20"/><path d="M714 130 h-20"/>
    <path d="M568 78 l-14 -14"/><path d="M686 196 l-14 -14"/>
    <path d="M672 78 l14 -14"/><path d="M554 196 l-14 14"/>
  </g>
  <!-- Modulfeld (perspektivisch) -->
  <g stroke="rgba(255,255,255,0.45)" stroke-width="2.5" fill="#0A1B33">
    <path d="M150 400 L340 250 H560 L370 400 Z"/>
  </g>
  <g stroke="rgba(255,255,255,0.25)" stroke-width="1.8">
    <path d="M215 400 L405 250"/>
    <path d="M280 400 L470 250"/>
    <path d="M345 400 L535 250"/>
    <path d="M245 325 H465"/>
  </g>
  <!-- aktive Zelle -->
  <path d="M247 325 L310 275 H370 L307 325 Z" fill="#FFD60A" opacity="0.85"/>
  <!-- Energiefluss zum Speicher -->
  <path d="M370 400 V470 H560 V520" stroke="#FFD60A" stroke-width="2.5" fill="none"/>
  <circle cx="370" cy="400" r="5" fill="#0A1B33" stroke="#FFD60A" stroke-width="2"/>
  <!-- Speicher -->
  <rect x="520" y="520" width="80" height="60" rx="8" fill="#0A1B33" stroke="rgba(255,255,255,0.4)" stroke-width="2.5"/>
  <rect x="532" y="536" width="34" height="28" rx="3" fill="#FFD60A"/>
  <rect x="572" y="536" width="8" height="28" rx="2" fill="rgba(255,255,255,0.35)"/>
  <text x="150" y="480" font-family="monospace" font-size="16" fill="rgba(255,255,255,0.45)" letter-spacing="3">9,8 kWp · DC/AC</text>
</svg>
