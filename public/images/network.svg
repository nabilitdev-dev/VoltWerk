<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Stilisiertes Netzwerk mit Verteilerknoten">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102A4E"/>
      <stop offset="1" stop-color="#0A1B33"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <!-- zentraler Switch -->
  <rect x="330" y="270" width="140" height="60" rx="10" fill="#0A1B33" stroke="rgba(255,255,255,0.5)" stroke-width="2.5"/>
  <circle cx="355" cy="300" r="5" fill="#FFD60A"/>
  <circle cx="378" cy="300" r="5" fill="#FFD60A"/>
  <circle cx="401" cy="300" r="5" fill="rgba(255,255,255,0.35)"/>
  <circle cx="424" cy="300" r="5" fill="rgba(255,255,255,0.35)"/>
  <circle cx="447" cy="300" r="5" fill="rgba(255,255,255,0.35)"/>
  <!-- Verbindungen -->
  <g fill="none" stroke-width="2.2">
    <path d="M330 300 H210 V160 H140" stroke="#FFD60A"/>
    <path d="M330 310 H180 V440 H120" stroke="rgba(255,255,255,0.3)"/>
    <path d="M470 300 H590 V140 H660" stroke="rgba(255,255,255,0.3)"/>
    <path d="M470 310 H620 V460 H690" stroke="#FFD60A"/>
    <path d="M400 270 V180"/>
    <path d="M400 270 V180" stroke="rgba(255,255,255,0.3)"/>
    <path d="M400 330 V440" stroke="rgba(255,255,255,0.3)"/>
  </g>
  <!-- Endpunkte -->
  <g>
    <rect x="100" y="140" width="40" height="40" rx="8" fill="none" stroke="#FFD60A" stroke-width="2.5"/>
    <rect x="80" y="420" width="40" height="40" rx="8" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="2.5"/>
    <rect x="660" y="120" width="40" height="40" rx="8" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="2.5"/>
    <rect x="690" y="440" width="40" height="40" rx="8" fill="none" stroke="#FFD60A" stroke-width="2.5"/>
    <circle cx="400" cy="170" r="10" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="2.5"/>
    <circle cx="400" cy="450" r="10" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="2.5"/>
  </g>
  <text x="330" y="570" font-family="monospace" font-size="16" fill="rgba(255,255,255,0.45)" letter-spacing="3">CAT 7 · 10 GBIT/S</text>
</svg>
