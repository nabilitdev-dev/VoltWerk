<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Stilisierte Wallbox mit Elektroauto">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102A4E"/>
      <stop offset="1" stop-color="#0A1B33"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <!-- Wand + Boden -->
  <path d="M120 80 V470 H720" stroke="rgba(255,255,255,0.3)" stroke-width="3" fill="none"/>
  <!-- Wallbox -->
  <rect x="160" y="160" width="110" height="150" rx="14" fill="#0A1B33" stroke="rgba(255,255,255,0.45)" stroke-width="2.5"/>
  <path d="M203 190 l-16 38 h22 l-14 34 34 -44 h-20 l14 -28 Z" fill="#FFD60A"/>
  <rect x="185" y="272" width="60" height="10" rx="5" fill="rgba(255,255,255,0.3)"/>
  <!-- Ladekabel -->
  <path d="M270 240 C360 240 330 420 430 415" stroke="#FFD60A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Auto -->
  <g stroke="rgba(255,255,255,0.5)" stroke-width="3" fill="#0A1B33">
    <path d="M420 430 h20 l30 -60 h140 l60 45 h50 a18 18 0 0 1 18 18 v12 a12 12 0 0 1 -12 12 h-306 Z" stroke-linejoin="round"/>
  </g>
  <path d="M480 372 h100 l40 32" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <circle cx="500" cy="458" r="24" fill="#0A1B33" stroke="rgba(255,255,255,0.5)" stroke-width="3"/>
  <circle cx="660" cy="458" r="24" fill="#0A1B33" stroke="rgba(255,255,255,0.5)" stroke-width="3"/>
  <circle cx="500" cy="458" r="8" fill="rgba(255,255,255,0.35)"/>
  <circle cx="660" cy="458" r="8" fill="rgba(255,255,255,0.35)"/>
  <!-- Ladeport -->
  <circle cx="430" cy="415" r="7" fill="#FFD60A"/>
  <text x="160" y="545" font-family="monospace" font-size="16" fill="rgba(255,255,255,0.45)" letter-spacing="3">11 kW · TYP 2</text>
</svg>
