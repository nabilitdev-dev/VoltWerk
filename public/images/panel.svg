    <rect x="292" y="247" width="30" height="42" rx="4" fill="rgba(255,255,255,0.28)"/>
    <rect x="330" y="247" width="30" height="42" rx="4" fill="rgba(255,255,255,0.28)"/>
    <rect x="368" y="247" width="30" height="42" rx="4" fill="#FFD60A"/>
